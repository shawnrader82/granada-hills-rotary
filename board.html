<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Board & Leadership | Granada Hills Rotary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="leadership-page">

  <!-- ==========================================
       HEADER
  ========================================== -->
  <div id="top"></div>
  <header id="site-header"></header>

  <!-- ==========================================
       PAGE HERO / TITLE
  ========================================== -->
  <section class="section section-blue" style="padding-top:7rem; padding-bottom:4rem;">
    <div class="container">
      <div class="section-header" data-aos="fade-up">
        <h2>Club Board & Leadership</h2>
        <div class="accent-line"></div>
        <p>
          Rotarians who serve as officers, directors, and committee chairs – guiding the Rotary Club of Granada Hills each year.
        </p>
      </div>

      <div
        class="hero-buttons"
        style="justify-content:center; margin-top:1.5rem;"
        data-aos="fade-up"
        data-aos-delay="100"
      >
        <a href="#current-leadership" class="btn btn-primary">
          <i class="fas fa-users"></i> View Current Leadership
        </a>
        <a href="https://granadahillsrotary.org/clubexecutives" class="btn btn-outline" target="_blank" rel="noopener">
          <i class="fas fa-external-link-alt"></i> Full List on ClubRunner
        </a>
      </div>
    </div>
  </section>

  <!-- ==========================================
       LEADERSHIP
  ========================================== -->
<section class="section section-gray" id="current-leadership">
  <div class="container">
    <div class="section-header">
      <h2>Leadership by Year</h2>
      <div class="accent-line"></div>
      <p>Select any Rotary year to see the board and officers who served.</p>
    </div>

    <!-- Year selector -->
    <div class="year-filter">
      <label for="yearSelect">Rotary year:</label>
      <select id="yearSelect"></select>
    </div>

    <h3 class="subheading">Leadership Team</h3>
    <div class="leadership-grid" id="currentLeadership"></div>
  </div>
</section>


  <!-- ==========================================
       FOOTER
  ========================================== -->
  <footer id="footer"></footer>

  <!-- ==========================================
     LEADERSHIP SCRIPT
========================================== -->
<script>
  (function() {
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwky-F823xy4srHN6lnU69362uIzr9NxHq9i-5d0Hoe7r9TijGJYs4t1sCXEaYRyXGW/exec?type=leadership';

    let allRows = [];
    let availableYears = [];

    // Custom role ordering: highest priority first
    const ROLE_ORDER = [
      'President',
      'Immediate Past President',
      'President Elect',
      'Vice President',
      'Secretary',
      'Treasurer',
      'Club Service',
      'Community Service',
      'International Service',
      'Vocational Service',
      'Youth Service',
      'Membership',
      'Public Image Chair',
      'Foundation',
      'Sergeant-at-Arms',
      'Director',
      'Board Member'
    ];

    function getRoleRank(role) {
      if (!role) return ROLE_ORDER.length + 1;
      const idx = ROLE_ORDER.findIndex(r =>
        r.toLowerCase() === role.toLowerCase()
      );
      return idx === -1 ? ROLE_ORDER.length : idx;
    }

    function getCurrentRotaryYearStart() {
      const today = new Date();
      const year = today.getFullYear();
      const julyFirst = new Date(year, 6, 1);
      return today >= julyFirst ? year : year - 1;
    }

    function createLeaderCard(entry) {
      const role = entry.Role || '';
      const name = entry.Name || '';
      const yearLabel = entry.YearLabel || '';
      const photo = entry.PhotoURL || '';
      const bio = entry.Bio || '';

      const div = document.createElement('div');
      div.className = 'leader-card';

      div.innerHTML = `
        <div class="leader-card-inner">
          ${photo ? `
            <div class="leader-photo">
              <img src="${photo}" alt="${name}">
            </div>
          ` : `
            <div class="leader-photo leader-photo-placeholder">
              <i class="fas fa-user"></i>
            </div>
          `}
          <div class="leader-info">
            <h3>${name || 'Vacant'}</h3>
            <div class="leader-role">${role}</div>
            ${yearLabel ? `<div class="leader-term">${yearLabel}</div>` : ''}
            ${bio ? `<p class="leader-bio">${bio}</p>` : ''}
          </div>
        </div>
      `;
      return div;
    }

    function createHistoryRow(entry) {
      const role = entry.Role || '';
      const name = entry.Name || 'Vacant';
      const yearLabel = entry.YearLabel || '';
      const div = document.createElement('div');
      div.className = 'past-president-row';
      div.innerHTML = `
        <span class="pp-year">${yearLabel}</span>
        <span class="pp-name">${role ? role + ' – ' : ''}${name}</span>
      `;
      return div;
    }

    function populateYearSelect() {
      const select = document.getElementById('yearSelect');
      if (!select) return;

      select.innerHTML = '';

      const years = [...availableYears].sort((a, b) => b - a);
      years.forEach(year => {
        const option = document.createElement('option');
        const next = year + 1;
        option.value = year;
        option.textContent = `${year}-${next}`;
        select.appendChild(option);
      });

      const currentStart = getCurrentRotaryYearStart();
      if (availableYears.includes(currentStart)) {
        select.value = currentStart;
      } else if (years.length) {
        select.value = years[0];
      }

      select.addEventListener('change', () => {
        const selectedYear = Number(select.value);
        renderForYear(selectedYear);
      });

      if (select.value) {
        renderForYear(Number(select.value));
      }
    }

    function renderForYear(termStartYear) {
      const yearRows = allRows.filter(row => Number(row.TermStart) === termStartYear);

      // Leadership cards: one per role, sorted by role priority then role name
      const byRole = {};
      yearRows.forEach(row => {
        const role = row.Role || 'Role';
        if (!byRole[role]) byRole[role] = row;
      });

      const currentContainer = document.getElementById('currentLeadership');
      currentContainer.innerHTML = '';
      Object.keys(byRole)
        .sort((a, b) => {
          const rankDiff = getRoleRank(a) - getRoleRank(b);
          if (rankDiff !== 0) return rankDiff;
          return a.localeCompare(b);
        })
        .forEach(role => {
          const card = createLeaderCard(byRole[role]);
          currentContainer.appendChild(card);
        });

      // Full list for that year: sorted by role priority then person name
      const historyContainer = document.getElementById('leadershipHistory');
      historyContainer.innerHTML = '';
      yearRows
        .slice()
        .sort((a, b) => {
          const rankDiff = getRoleRank(a.Role || '') - getRoleRank(b.Role || '');
          if (rankDiff !== 0) return rankDiff;
          return (a.Name || '').localeCompare(b.Name || '');
        })
        .forEach(entry => {
          historyContainer.appendChild(createHistoryRow(entry));
        });
    }

    function initLeadership() {
      fetch(ENDPOINT)
        .then(res => res.json())
        .then(rows => {
          if (!Array.isArray(rows)) return;
          allRows = rows;

          const yearsSet = new Set();
          rows.forEach(r => {
            const y = Number(r.TermStart);
            if (y) yearsSet.add(y);
          });
          availableYears = Array.from(yearsSet);

          populateYearSelect();
        })
        .catch(err => {
          console.error('Error loading leadership data:', err);
        });
    }

    document.addEventListener('DOMContentLoaded', initLeadership);
  })();
</script>


  <!-- ==========================================
       Smooth scroll
  ========================================== -->
  <script>
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        if (!href || href === '#') return;
        const target = document.querySelector(href);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  </script>

  <!-- ==========================================
       Shared Header & Footer Loader + Nav
  ========================================== -->
  <script>
    Promise.all([
      fetch('header.html').then(r => r.text()),
      fetch('footer.html').then(r => r.text())
    ])
    .then(([headerHtml, footerHtml]) => {
      const headerEl = document.getElementById('site-header');
      if (headerEl) headerEl.innerHTML = headerHtml;

      const footerEl = document.getElementById('footer');
      if (footerEl) footerEl.innerHTML = footerHtml;

      const navbar   = document.getElementById('navbar');
      const navLinks = document.getElementById('navLinks');

      if (navbar) {
        window.addEventListener('scroll', () => {
          if (window.scrollY > 80) {
            navbar.classList.add('scrolled');
          } else {
            navbar.classList.remove('scrolled');
          }
        });
      }

      window.toggleNav = function () {
        if (navLinks) {
          navLinks.classList.toggle('active');
        }
      };

      if (navLinks) {
        navLinks.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            navLinks.classList.remove('active');
          });
        });
      }
    })
    .catch(err => console.error('Error loading header/footer', err));
  </script>
</body>
</html>
